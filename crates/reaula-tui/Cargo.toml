[package]
name = "reaula-tui"
version = "0.1.0"
edition = "2024"
description = "Ratatui terminal dashboard for the Aula WIN 60 HE daemon"
license = "MIT OR Apache-2.0"

[[bin]]
name = "reaula-tui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
reaula-core = { path = "../reaula-core" }

