[package]
name = "atrium-gui"
version = "0.1.0"
edition = "2024"
description = "GPUI native desktop application for the Aula WIN 60 HE daemon"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MizProject/atrium"

[[bin]]
name = "atrium-gui"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
gpui-kit = "0.10.0"
image = "0.25"
pollster = "0.4"
atrium-core = { path = "../atrium-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.16"
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles", "wgsl"] }

