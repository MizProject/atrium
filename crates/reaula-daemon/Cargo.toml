[package]
name = "reaula-daemon"
version = "0.1.0"
edition = "2024"
description = "Privileged USB/HID hardware daemon with UID-restricted Unix socket IPC for Aula WIN 60 HE"
license = "MIT OR Apache-2.0"

[[bin]]
name = "reaulad"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
reaula-core = { path = "../reaula-core" }

