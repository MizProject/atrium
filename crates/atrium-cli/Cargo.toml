[package]
name = "atrium-cli"
version = "0.1.0"
edition = "2024"
description = "CLI frontend for the Aula WIN 60 HE driver & atriumd daemon"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MizProject/atrium"

[[bin]]
name = "atrium"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
atrium-core = { path = "../atrium-core" }

