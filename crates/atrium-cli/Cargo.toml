[package]
name = "reaula-cli"
version = "0.1.0"
edition = "2024"
description = "CLI frontend for the Aula WIN 60 HE driver & reaulad daemon"
license = "MIT OR Apache-2.0"

[[bin]]
name = "reaula"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
reaula-core = { path = "../reaula-core" }

